name: Deploy to Azure Services

on:
  push:
    branches:
      - main
      - features/k8sdeployment
    paths:
      - 'azure/**'
      - '.github/workflows/azure-deploy.yaml'

env:
  REGISTRY: myregistry.azurecr.io

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: |
          cd azure
          terraform init \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=kubernetes-app.tfstate" \
            -backend-config="resource_group_name=${{ secrets.AZURE_RESOURCE_GROUP }}"

      - name: Terraform Validate
        run: |
          cd azure
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          cd azure
          terraform plan -out=tfplan \
            -var="resource_group_name=${{ secrets.AZURE_RESOURCE_GROUP }}" \
            -var="location=${{ secrets.AZURE_LOCATION }}" \
            -var="environment=production"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          cd azure
          terraform apply -auto-approve tfplan

      - name: Output Terraform values
        run: |
          cd azure
          terraform output -json > outputs.json
          cat outputs.json

  deploy-app-service:
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.BACKEND_APP_SERVICE_NAME }}
          images: ${{ env.REGISTRY }}/python-backend:${{ github.sha }}

      - name: Deploy Frontend to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.FRONTEND_APP_SERVICE_NAME }}
          images: ${{ env.REGISTRY }}/angular-frontend:${{ github.sha }}

  deploy-function-app:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Azure Functions Core Tools
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
          sudo mv microsoft.gpg /etc/apt/trusted.gpg.d/microsoft.gpg
          sudo sh -c 'echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/trusted.gpg.d/microsoft.gpg] https://packages.microsoft.com/repos/microsoft-ubuntu-$(lsb_release -cs)-prod $(lsb_release -cs) main" > /etc/apt/sources.list.d/microsoft.list'
          sudo apt-get update
          sudo apt-get install azure-functions-core-tools-4

      - name: Deploy to Function App
        run: |
          cd azure/functions
          func azure functionapp publish ${{ secrets.FUNCTION_APP_NAME }} --python
