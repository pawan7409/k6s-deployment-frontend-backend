#!/bin/bash

# Docker Compose file for local development

version: '3.8'

services:
  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: angular-frontend
    ports:
      - "4200:4200"
    environment:
      - BACKEND_URL=http://backend:5000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - app-network

  # Python Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: python-backend
    ports:
      - "5000:5000"
    environment:
      - DEBUG=True
      - ENVIRONMENT=development
      - STORAGE_ACCOUNT_NAME=${STORAGE_ACCOUNT_NAME}
      - KEYVAULT_URL=${KEYVAULT_URL}
    volumes:
      - ./backend:/app
    networks:
      - app-network

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  backend-data:

networks:
  app-network:
    driver: bridge
