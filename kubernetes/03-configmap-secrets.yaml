apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: default
data:
  storage-account-name: "yourstorageaccount"
  keyvault-url: "https://yourkeyvault.vault.azure.net/"
  app-service-name: "your-app-service"
---
apiVersion: v1
kind: Secret
metadata:
  name: azure-credentials
  namespace: default
type: Opaque
stringData:
  subscription-id: "your-subscription-id"
  resource-group: "your-resource-group"
  client-id: "your-client-id"
  client-secret: "your-client-secret"
