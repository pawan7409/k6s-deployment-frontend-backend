apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-frontend
  namespace: default
  labels:
    app: angular-frontend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: angular-frontend
  template:
    metadata:
      labels:
        app: angular-frontend
        version: v1
    spec:
      containers:
      - name: angular-frontend
        image: myregistry.azurecr.io/angular-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4200
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 4200
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 4200
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        env:
        - name: BACKEND_URL
          value: "http://python-backend:5000"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - angular-frontend
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: angular-frontend
  namespace: default
  labels:
    app: angular-frontend
spec:
  type: ClusterIP
  selector:
    app: angular-frontend
  ports:
  - name: http
    port: 80
    targetPort: 4200
    protocol: TCP
